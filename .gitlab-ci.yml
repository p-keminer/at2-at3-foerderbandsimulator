stages:
  - verify
default:
  tags:
    - saas-windows-medium-amd64
variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
offline:
  stage: verify
  timeout: 20 minutes
  script:
    - '& .\tools\check-public-content.ps1'
    - '& .\tools\setup-sdk.ps1'
    - '& .\build.ps1 -Test -UiSmoke -EvidenceDirectory artifacts\ci'
    - '& .\tools\test-probe-watchdog.ps1 -Evidence artifacts\ci\watchdog.json'
    - '& .\tools\package.ps1'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/ci/
      - output/AT2AT3-Offline.zip
      - output/AT2AT3-Offline.zip.sha256
    reports:
      junit: artifacts/ci/core-tests.junit.xml
